<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">
<meta name="theme-color" content="#0e2417">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goominhos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-512.png">
<title>Goominhos — O Mundo Pegajoso</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🟢</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
    background: #0e2417; color: #fff; user-select: none; -webkit-user-select: none;
    touch-action: none; overscroll-behavior: none;
  }
  .hidden { display: none !important; }
  #buildTag {
    position: fixed; right: 8px; bottom: calc(6px + env(safe-area-inset-bottom)); z-index: 450;
    font-size: 11px; font-weight: 800; color: rgba(234,255,208,0.85);
    background: rgba(14,36,23,0.78); border: 1px solid rgba(174,234,110,0.6);
    padding: 3px 7px; border-radius: 10px; pointer-events: none;
  }

  .overlay {
    position: fixed; inset: 0; z-index: 300;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #0e2417, #1c4a2a);
  }
  .big-btn {
    font-family: inherit; font-size: clamp(18px, 4.6vw, 26px); font-weight: 900;
    background: linear-gradient(135deg, #aeea6e, #5cb85c); color: #16330f;
    border: none; border-radius: 20px; padding: 14px 40px; cursor: pointer;
    box-shadow: 0 6px 0 #3e7a3e, 0 10px 24px rgba(0,0,0,0.4);
  }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #3e7a3e; }

  /* START */
  #startOverlay {
    background: url('assets/menu.jpg') center / cover no-repeat #0e2417;
  }
  #startOverlay::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,25,15,0.42) 0%, rgba(10,25,15,0.08) 40%, rgba(10,25,15,0.55) 100%);
  }
  #startOverlay > * { position: relative; z-index: 1; }
  #startOverlay h1 {
    font-size: clamp(34px, 9vw, 60px); color: #aeea6e; text-align: center; line-height: 1.05;
    text-shadow: 0 3px 0 #2e5b23, 0 8px 20px rgba(0,0,0,0.6); padding: 0 14px;
  }
  #startOverlay .sub { margin: 12px 0 30px; font-size: clamp(14px, 3.6vw, 19px); color: #d7f0c0; font-weight: 700; text-align: center; padding: 0 20px; }
  #startOverlay .goo-face { font-size: 70px; animation: bob 2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

  /* LEVEL SELECT */
  #levelSelect {
    padding: max(10px, env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    gap: 10px; justify-content: flex-start;
    overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    background: url('assets/menu.jpg') center / cover no-repeat #0e2417;
  }
  #levelSelect::before {
    content: ''; position: absolute; inset: 0; background: rgba(10, 25, 15, 0.82);
  }
  #levelSelect > * { position: relative; z-index: 1; }
  #levelSelect h2 { color: #aeea6e; font-size: clamp(22px, 5.5vw, 34px); text-shadow: 0 2px 0 #2e5b23; margin-top: 2px; }
  .lv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: min(96vw, 900px); margin: 0 auto; }
  .lv-card {
    border: 3px solid #aeea6e; border-radius: 16px; overflow: hidden; cursor: pointer;
    background: #12301c; padding: 0; font-family: inherit; position: relative;
    box-shadow: 0 6px 16px rgba(0,0,0,0.5); transition: transform 0.12s;
  }
  .lv-card:active { transform: scale(0.95); }
  .lv-card img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; }
  .lv-card .lv-name { display: block; color: #eaffd0; font-weight: 900; font-size: clamp(11px, 2.8vw, 15px); padding: 6px 4px; text-align: center; }
  .lv-card .lv-num {
    position: absolute; top: 6px; left: 6px; background: rgba(14,36,23,0.85); color: #aeea6e;
    border-radius: 10px; padding: 2px 9px; font-weight: 900; font-size: 14px;
  }
  .lv-card .lv-done { position: absolute; top: 6px; right: 6px; font-size: 20px; }
  .lv-card.locked { filter: grayscale(0.9) brightness(0.55); pointer-events: auto; }

  /* GAME */
  #gameWrap { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #0e2417; }
  #gameWrap.active { display: flex; }
  #gameCanvas { display: block; touch-action: none; }
  #hud {
    position: fixed; top: 8px; left: 8px; right: 8px; z-index: 20; display: none;
    justify-content: space-between; align-items: center; pointer-events: none;
  }
  #hud.active { display: flex; }
  .hud-pill {
    background: rgba(14,36,23,0.82); border: 2px solid #aeea6e; color: #eaffd0;
    border-radius: 14px; padding: 6px 14px; font-weight: 900; font-size: clamp(13px, 3.4vw, 17px);
    pointer-events: auto;
  }
  button.hud-pill { cursor: pointer; font-family: inherit; }
  #hudCenter { display: flex; gap: 8px; }

  /* WIN / FAIL */
  #msgOverlay { background: rgba(10,25,15,0.88); z-index: 310; }
  #msgOverlay .box {
    text-align: center; background: linear-gradient(135deg, #f2ffd9, #d9f2b8); color: #16330f;
    border-radius: 24px; border: 4px solid #5cb85c; padding: 26px 34px; max-width: 88vw;
    box-shadow: 0 16px 50px rgba(0,0,0,0.6); animation: popIn 0.45s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes popIn { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
  #msgOverlay h2 { font-size: clamp(22px, 6vw, 32px); }
  #msgOverlay .stars { font-size: 38px; margin: 8px 0; letter-spacing: 5px; }
  #msgOverlay .msg { font-weight: 800; font-size: clamp(14px, 3.8vw, 18px); margin-bottom: 16px; }
  #msgOverlay .row { display: flex; gap: 12px; justify-content: center; }
  #msgOverlay .big-btn { font-size: clamp(15px, 4vw, 20px); padding: 12px 26px; }

  .star-burst {
    position: fixed; z-index: 390; font-size: 30px; pointer-events: none;
    animation: starBurst 1.1s ease-out forwards;
  }
  @keyframes starBurst {
    0% { transform: translate(0,0) scale(0.4); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.3) rotate(200deg); opacity: 0; }
  }

  /* rotate hint: only on portrait phones */
  #rotateHint {
    display: none; position: fixed; inset: 0; z-index: 400;
    background: rgba(10, 25, 15, 0.94); flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 30px;
  }
  #rotateHint .phone { font-size: 64px; animation: rotatePhone 1.6s ease-in-out infinite; }
  @keyframes rotatePhone { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
  #rotateHint p { margin-top: 18px; font-size: 20px; font-weight: 900; color: #aeea6e; }
  @media (orientation: portrait) and (max-width: 700px) {
    #rotateHint.show { display: flex; }
  }
  @media (max-height: 760px) {
    #levelSelect h2 { font-size: clamp(18px, 4.6vw, 28px); }
    .lv-grid { gap: 8px; }
    .lv-card img { aspect-ratio: 16/9; }
    .lv-card .lv-name { padding: 4px 4px; font-size: clamp(10px, 2.5vw, 13px); }
  }
</style>
</head>
<body>

<div id="buildTag">v2026.08.21-20</div>

<div class="overlay" id="startOverlay">
  <h1>Goominhos<br><span style="font-size:0.45em; color:#d7f0c0">O Mundo Pegajoso</span></h1>
  <div class="sub">Constrói pontes, torres e escadas com bolinhas de goo!<br>Leva-os até ao cano mágico. 🕳️</div>
  <button class="big-btn" id="startBtn">▶ COMEÇAR</button>
</div>

<div class="overlay hidden" id="levelSelect">
  <h2>🗺️ Escolhe um nível!</h2>
  <div class="lv-grid" id="lvGrid"></div>
</div>

<div id="gameWrap"><canvas id="gameCanvas"></canvas></div>
<div id="hud">
  <button class="hud-pill" id="homeBtn">← Níveis</button>
  <div id="hudCenter">
    <span class="hud-pill" id="hudLevel"></span>
    <span class="hud-pill" id="hudPipe"></span>
    <span class="hud-pill" id="hudGoos"></span>
  </div>
  <button class="hud-pill" id="retryBtn">↻</button>
</div>

<div id="rotateHint"><div class="phone">📱</div><p>Vira o telemóvel de lado<br>para jogar melhor! 🔄</p></div>

<div class="overlay hidden" id="msgOverlay">
  <div class="box">
    <h2 id="msgTitle"></h2>
    <div class="stars" id="msgStars"></div>
    <div class="msg" id="msgText"></div>
    <div class="row">
      <button class="big-btn" id="msgBtnA"></button>
      <button class="big-btn hidden" id="msgBtnB"></button>
    </div>
  </div>
</div>

<script src="assets/matter.min.js"></script>
<script>
// ==================== AUDIO ====================
let voice = null, audioCtx = null;
function initAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  pickVoice();
}
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /pt(-|_)PT/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = pickVoice;
function speak(text, cb) {
  if (!('speechSynthesis' in window)) { if (cb) cb(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'pt-PT'; if (voice) u.voice = voice;
  u.rate = 0.97; u.pitch = 1.15;
  if (cb) { u.onend = cb; u.onerror = cb; }
  speechSynthesis.speak(u);
}
function tone(freq, dur, type, when, gain) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + (when || 0);
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(gain || 0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur);
}
const sfxGrab = () => tone(440, 0.07, 'triangle');
const sfxAttach = () => { tone(520, 0.09, 'triangle'); tone(760, 0.12, 'triangle', 0.06); };
const sfxPop = () => tone(300, 0.15, 'square', 0, 0.05);
const sfxSuck = () => { tone(900, 0.3, 'sine', 0, 0.08); tone(600, 0.3, 'sine', 0.12, 0.08); tone(300, 0.35, 'sine', 0.24, 0.08); };
const sfxWin = () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'sine', i * 0.13)); };

// ==================== DATA ====================
const WW = 1600, WH = 900, GOO_R = 26, LINK_DIST = 175, MAX_LINKS = 6;
const TYPES = {
  basic:   { color: '#7ed957', dark: '#3e8e2f', density: 0.0016, nome: 'Goominho' },
  balloon: { color: '#ffd54f', dark: '#c79a1d', density: 0.0010, nome: 'Levinho' },
  heavy:   { color: '#90a4ae', dark: '#4e6570', density: 0.0060, nome: 'Pesadão' },
  sticky:  { color: '#f48fb1', dark: '#ad4a72', density: 0.0016, nome: 'Cola' },
};
let LEVELS = null;

// ==================== STATE ====================
let progress = { done: [false, false, false, false, false, false] };
try { const p = JSON.parse(localStorage.getItem('goo_progress')); if (p && p.done && p.done.length === 6) progress = p; } catch (e) {}
function saveProgress() { try { localStorage.setItem('goo_progress', JSON.stringify(progress)); } catch (e) {} }
function unlocked(n) { return n === 0 || progress.done[n - 1]; }

const { Engine, Bodies, Body, Composite, Constraint, Events } = Matter;
let engine = null, level = null, levelIdx = 0;
let goos = [], links = [], terrainBodies = [], pipe = null;
let sucked = 0, gameState = 'menu'; // menu | play | won | lost
let pipeKeeper = null;
let nextAutoSendAt = 0;
let drag = null, particles = [], suckAnims = [];
let idleTimer = 0, lastActivity = 0;

// Collision groups: free goos should not push structural goos around
const CAT_TERRAIN = 0x0001;
const CAT_STRUCT  = 0x0002;
const CAT_FREE    = 0x0004;

// ==================== CANVAS ====================
const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
let scale = 1, offX = 0, offY = 0;
const bgImgs = {};
function fitCanvas() {
  const aw = window.innerWidth, ah = window.innerHeight;
  scale = Math.min(aw / WW, ah / WH);
  canvas.width = Math.round(WW * scale); canvas.height = Math.round(WH * scale);
  canvas.style.width = canvas.width + 'px'; canvas.style.height = canvas.height + 'px';
  offX = 0; offY = 0;
}
window.addEventListener('resize', fitCanvas);
function toWorld(e) {
  const r = canvas.getBoundingClientRect();
  const cx = (e.clientX - r.left) / scale, cy = (e.clientY - r.top) / scale;
  return { x: cx, y: cy };
}

// ==================== LEVEL BUILD ====================
function loadLevel(idx) {
  levelIdx = idx; level = LEVELS[idx];
  engine = Engine.create({ enableSleeping: false });
  engine.gravity.y = 1;
  goos = []; links = []; particles = []; suckAnims = []; sucked = 0; drag = null; pipeKeeper = null; nextAutoSendAt = 0;
  terrainBodies = level.terrain.map(poly => {
    const cx = poly.reduce((s, p) => s + p[0], 0) / poly.length;
    const cy = poly.reduce((s, p) => s + p[1], 0) / poly.length;
    const b = Bodies.fromVertices(cx, cy, [poly.map(p => ({ x: p[0], y: p[1] }))], { isStatic: true, friction: 0.9, label: 'terrain' });
    return b;
  });
  Composite.add(engine.world, terrainBodies);
  pipe = { x: level.pipe[0], y: level.pipe[1], dir: level.pipe[2] };

  // starter structural goos, welded to ground at spawn
  const [sx, sy] = level.spawn;
  const g0 = makeGoo('basic', sx - 45, sy - 10, 'struct');
  const g1 = makeGoo('basic', sx + 45, sy - 10, 'struct');
  [g0, g1].forEach(g => {
    const t = nearestTerrain(g.body.position.x, g.body.position.y);
    if (t) weld(g, t);
  });
  addLink(g0, g1);
  // free goos: resting on the ground near the spawn point
  let i = 0;
  for (const [type, count] of Object.entries(level.goos)) {
    for (let k = 0; k < count; k++) {
      const gx = Math.max(70, sx - 200) + (i % 6) * 68;
      const gy = sy - 45 - Math.floor(i / 6) * 62;
      makeGoo(type, gx, gy, 'free');
      i++;
    }
  }
  lastActivity = performance.now(); idleTimer = 0;
  gameState = 'play';
  document.getElementById('hudLevel').textContent = level.id + '. ' + level.name;
  updateHud();
  speak(level.intro);
}
function nearestTerrain(x, y) {
  let best = null, bd = 1e9;
  terrainBodies.forEach(t => {
    const d = Math.hypot(t.position.x - x, t.position.y - y);
    if (d < bd) { bd = d; best = t; }
  });
  return best;
}
function makeGoo(type, x, y, state) {
  const T = TYPES[type];
  const b = Bodies.circle(x, y, GOO_R, {
    density: T.density, friction: 0.6, restitution: 0.05, label: 'goo',
  });
  const g = {
    body: b, type, state, links: [], welds: [],
    blink: Math.random() * 4000, wob: Math.random() * 6.28,
    aiDir: Math.random() < 0.5 ? -1 : 1,
    aiFlipAt: performance.now() + 900 + Math.random() * 1600,
    aiHopAt: performance.now() + 700 + Math.random() * 1800,
  };
  b.gooRef = g;
  applyCollisionProfile(g);
  goos.push(g); Composite.add(engine.world, b);
  return g;
}

function applyCollisionProfile(g) {
  const b = g.body;
  if (!b) return;
  if (g.state === 'commuting') {
    b.isSensor = true;
    b.collisionFilter.category = CAT_FREE;
    b.collisionFilter.mask = 0;
    return;
  }
  b.isSensor = false;
  if (g.state === 'free') {
    // free roamers collide with terrain and each other, but not structure
    b.collisionFilter.category = CAT_FREE;
    b.collisionFilter.mask = CAT_TERRAIN | CAT_FREE;
  } else {
    // structural/drag/pipe_anchor collide with terrain+structure, but ignore free roamers
    b.collisionFilter.category = CAT_STRUCT;
    b.collisionFilter.mask = CAT_TERRAIN | CAT_STRUCT;
  }
}

function setGooState(g, newState) {
  g.state = newState;
  applyCollisionProfile(g);
}
function addLink(ga, gb) {
  if (ga === gb) return null;
  if (ga.links.some(l => l.other === gb)) return null;
  if (ga.links.length >= MAX_LINKS || gb.links.length >= MAX_LINKS) return null;
  const d = Math.hypot(ga.body.position.x - gb.body.position.x, ga.body.position.y - gb.body.position.y);
  const c = Constraint.create({
    bodyA: ga.body, bodyB: gb.body, length: Math.max(d, GOO_R * 1.4),
    stiffness: 0.5, damping: 0.15,
  });
  Composite.add(engine.world, c);
  const rec = { c, other: gb }; ga.links.push(rec);
  gb.links.push({ c, other: ga });
  links.push(c);
  return c;
}

function planConnections(g) {
  const p = g.body.position;
  const near = structuralGoos()
    .filter(s => s !== g)
    .map(s => ({ s, d: Math.hypot(s.body.position.x - p.x, s.body.position.y - p.y) }))
    .filter(o => o.d < LINK_DIST + GOO_R + 42)
    .sort((a, b) => a.d - b.d);

  if (near.length === 0) return [];

  const selected = [];
  const counts = new Map();
  counts.set(g, g.links.length);
  for (const s of structuralGoos()) counts.set(s, s.links.length);

  function canPair(node) {
    const cg = counts.get(g) || 0;
    const cn = counts.get(node) || 0;
    if (cg >= MAX_LINKS || cn >= MAX_LINKS) return false;
    if (g.links.some(l => l.other === node)) return false;
    if (selected.includes(node)) return false;
    return true;
  }
  function take(node) {
    selected.push(node);
    counts.set(g, (counts.get(g) || 0) + 1);
    counts.set(node, (counts.get(node) || 0) + 1);
  }

  const first = near.find(o => canPair(o.s));
  if (!first) return [];
  take(first.s);

  if ((counts.get(g) || 0) >= 2) return selected;

  const fx = first.s.body.position.x - p.x;
  const fy = first.s.body.position.y - p.y;
  const fl = Math.hypot(fx, fy) || 1;
  const ranked = near
    .filter(o => o.s !== first.s)
    .map(o => {
      const vx = o.s.body.position.x - p.x;
      const vy = o.s.body.position.y - p.y;
      const vl = Math.hypot(vx, vy) || 1;
      const cos = (fx * vx + fy * vy) / (fl * vl);
      return { node: o.s, d: o.d, cos };
    })
    .sort((a, b) => (a.cos - b.cos) || (a.d - b.d));

  const second = ranked.find(r => canPair(r.node));
  if (second) take(second.node);

  return selected;
}

function findPipeRoute() {
  const nodes = structuralGoos();
  if (nodes.length < 3) return null;
  const start = nodes.reduce((a, b) => {
    const da = Math.hypot(a.body.position.x - level.spawn[0], a.body.position.y - level.spawn[1]);
    const db = Math.hypot(b.body.position.x - level.spawn[0], b.body.position.y - level.spawn[1]);
    return db < da ? b : a;
  });
  const end = nodes.reduce((a, b) => {
    const da = Math.hypot(a.body.position.x - pipe.x, a.body.position.y - pipe.y);
    const db = Math.hypot(b.body.position.x - pipe.x, b.body.position.y - pipe.y);
    return db < da ? b : a;
  });
  const endDist = Math.hypot(end.body.position.x - pipe.x, end.body.position.y - pipe.y);
  if (endDist > 170) return null;

  const q = [start], seen = new Set([start]), prev = new Map();
  while (q.length) {
    const cur = q.shift();
    if (cur === end) break;
    for (const rec of cur.links) {
      const nxt = rec.other;
      if (nxt.state !== 'struct' && nxt.state !== 'pipe_anchor') continue;
      if (seen.has(nxt)) continue;
      seen.add(nxt); prev.set(nxt, cur); q.push(nxt);
    }
  }
  if (!seen.has(end)) return null;

  const pathNodes = [];
  let cur = end;
  while (cur) {
    pathNodes.push(cur);
    cur = prev.get(cur) || null;
  }
  pathNodes.reverse();
  return pathNodes;
}

function maybeAutoSendGoos(now) {
  if (gameState !== 'play') return;
  if (now < nextAutoSendAt) return;
  const route = findPipeRoute();
  if (!route || route.length < 2) return;

  // only dispatch from the spawn pen; detached goos dropped on the structure should stay where released
  const sx = level.spawn[0], sy = level.spawn[1];
  const freeNearSpawn = goos
    .filter(x => x.state === 'free')
    .filter(x => Math.hypot(x.body.position.x - sx, x.body.position.y - sy) < 240)

        if (g.routeSeg >= g.route.length - 1) { suckGoo(g); break; }

canvas.addEventListener('pointerdown', e => {

    Math.hypot(g.body.position.x - p.x, g.body.position.y - p.y) < GOO_R + 14);

canvas.addEventListener('pointermove', e => {

      if (drag.g.welds.length && anchors <= 2) {

function handlePointerRelease(e) {

let acc = 0, lastT = 0;

  acc += dt;
  while (acc > 16.6) {
    Engine.update(engine, 16.6);
    acc -= 16.6;
  }
  if (gameState !== 'play' && gameState !== 'won' && gameState !== 'lost') { render(now); return; }

  const t0 = performance.now();
  // sticky goos grab terrain on contact (checked periodically)
  if (gameState === 'play' && Math.floor(t0 / 250) !== Math.floor((t0 - dt) / 250)) {
    goos.forEach(g => {

  if (gameState === 'play') {
    maybeAutoSendGoos(t0);

    if (g.state === 'commuting') return;
    const b = g.body;
    // balloons: free ones hover and are easy to catch; structural balloons lift gently without stealing the whole build
    if (g.type === 'balloon') {
      if (g.state === 'free' && !drag) {
        // soft vertical hover band
        if (b.position.y > 255) Body.applyForce(b, b.position, { x: 0, y: -b.mass * 0.00095 });
        else if (b.position.y < 175) Body.applyForce(b, b.position, { x: 0, y: b.mass * 0.00070 });

        const nearStruct = structuralGoos()

          .sort((a, b) => a.d - b.d)[0];

          const dx = nearStruct.s.body.position.x - b.position.x;
          Body.applyForce(b, b.position, { x: Math.sign(dx) * 0.00012 * b.mass, y: 0 });

// ==================== RENDER ====================
function render(now) {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, WW, WH);
  const bg = bgImgs[level.id];
  if (bg && bg.complete) ctx.drawImage(bg, 0, 0, WW, WH);
  else { ctx.fillStyle = '#bfe3f2'; ctx.fillRect(0, 0, WW, WH); }

  // pipe swirl
  if (pipe) {
    ctx.save(); ctx.translate(pipe.x, pipe.y);
    ctx.strokeStyle = 'rgba(178,255,89,0.75)'; ctx.lineWidth = 5;
    for (let i = 0; i < 3; i++) {

      ctx.beginPath(); ctx.arc(0, 0, 46 - i * 10, a, a + 2.4); ctx.stroke();
    }
    ctx.restore();
  }
  // links
  ctx.lineCap = 'round';
  links.forEach(c => {
    if (!c.bodyA || !c.bodyB) return;
    const a = { x: c.bodyA.position.x + (c.pointA ? c.pointA.x : 0), y: c.bodyA.position.y + (c.pointA ? c.pointA.y : 0) };
    const b = { x: c.bodyB.position.x + (c.pointB ? c.pointB.x : 0), y: c.bodyB.position.y + (c.pointB ? c.pointB.y : 0) };
    ctx.strokeStyle = 'rgba(30,60,25,0.85)'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  });

  if (drag && !drag.structTap) {
    const p = drag.g.body.position;
    const near = planConnections(drag.g);
    ctx.setLineDash([10, 8]);
    near.forEach(node => {
      ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(node.body.position.x, node.body.position.y); ctx.stroke();
    });
    ctx.setLineDash([]);
    ctx.strokeStyle = near.length ? 'rgba(178,255,89,0.9)' : 'rgba(255,120,120,0.7)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, LINK_DIST * 0.5, 0, 7); ctx.stroke();
  }
  // goos
  goos.forEach(g => {
    if (g.state === 'lost' || g.state === 'sucked') return;
    drawGoo(g, now);
  });
  // suck animations
  suckAnims.forEach(s => {
    const k = (performance.now() - s.t0) / 450;
    const x = s.x + (pipe.x - s.x) * k, y = s.y + (pipe.y - s.y) * k;
    const r = GOO_R * (1 - k * 0.9);
    ctx.fillStyle = s.color;

  particles.forEach(p => {
    const k = (performance.now() - p.t0) / p.life;
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x + p.vx * k * 30, p.y + p.vy * k * 30, 5 * (1 - k), 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  });

    for (let i = 0; i < 5; i++) {
      const wy = 150 + i * 150, ph = ((now / 900) + i * 0.3) % 1;
      const wx = level.wind.x1 - ph * (level.wind.x1 - level.wind.x0);

function drawGoo(g, now) {
  const b = g.body, T = TYPES[g.type];

  const r = GOO_R * (g.type === 'heavy' ? 1.18 : 1);
  ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.scale(wob, 2 - wob);
  // body
  ctx.fillStyle = T.color;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.strokeStyle = T.dark; ctx.lineWidth = 3; ctx.stroke();
  // shine
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.4, r * 0.28, r * 0.18, -0.6, 0, 7); ctx.fill();
  // eyes
  const blink = (now + g.blink) % 3800 < 130 ? 0.15 : 1;
  const ex = r * 0.36, ey = -r * 0.12, er = r * 0.24;
  const vx = Math.min(Math.max(b.velocity.x, -3), 3), vy = Math.min(Math.max(b.velocity.y, -3), 3);
  [-ex, ex].forEach(x => {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(x, ey, er, er * blink, 0, 0, 7); ctx.fill();
    if (blink > 0.5) {
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(x + vx, ey + vy * 0.6, er * 0.45, 0, 7); ctx.fill();
    }
  });

  if (g.type === 'balloon') {
    ctx.strokeStyle = T.dark; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, r); ctx.quadraticCurveTo(4, r + 10, 0, r + 18); ctx.stroke();
  } else if (g.type === 'sticky') {
    ctx.fillStyle = T.dark;
    [[-r * 0.5, r * 0.45], [0, r * 0.6], [r * 0.5, r * 0.45]].forEach(p => {
      ctx.beginPath(); ctx.arc(p[0], p[1], 3.5, 0, 7); ctx.fill();
    });
  } else if (g.type === 'heavy') {
    ctx.fillStyle = T.dark;
    ctx.fillRect(-r * 0.35, r * 0.35, r * 0.7, 5);
  }
  ctx.restore();
}

// ==================== UI ====================
function showMsg(title, stars, msg, btnA, cbA, btnB, cbB) {
  document.getElementById('msgTitle').textContent = title;
  document.getElementById('msgStars').textContent = stars;
  document.getElementById('msgText').textContent = msg;
  const A = document.getElementById('msgBtnA'), B = document.getElementById('msgBtnB');
  A.textContent = btnA; A.onclick = () => { hideMsg(); cbA && cbA(); };
  if (btnB) { B.classList.remove('hidden'); B.textContent = btnB; B.onclick = () => { hideMsg(); cbB && cbB(); }; }
  else B.classList.add('hidden');
  document.getElementById('msgOverlay').classList.remove('hidden');
}
function hideMsg() { document.getElementById('msgOverlay').classList.add('hidden'); }
function starBurst() {
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div');
    s.className = 'star-burst'; s.textContent = '⭐';
    s.style.left = '50%'; s.style.top = '45%';
    s.style.setProperty('--dx', (Math.random() * 400 - 200) + 'px');
    s.style.setProperty('--dy', (Math.random() * 340 - 200) + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
}
function showLevels() {
  gameState = 'menu';
  document.getElementById('gameWrap').classList.remove('active');
  document.getElementById('hud').classList.remove('active');
  updateRotateHint();
  const g = document.getElementById('lvGrid'); g.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const c = document.createElement('button');
    const locked = !unlocked(i);
    c.className = 'lv-card' + (locked ? ' locked' : '');
    c.innerHTML = '<span class="lv-num">' + (i + 1) + '</span>' +
      (progress.done[i] ? '<span class="lv-done">✅</span>' : '') +
      '<img src="assets/bg' + lv.id + '.jpg" alt="">' +
      '<span class="lv-name">' + (locked ? '🔒 ???' : lv.name) + '</span>';
    c.onclick = () => {
      if (locked) { sfxPop(); return; }
      initAudio();
      document.getElementById('levelSelect').classList.add('hidden');
      document.getElementById('gameWrap').classList.add('active');
      document.getElementById('hud').classList.add('active');
      updateRotateHint();
      loadLevel(i);
    };
    g.appendChild(c);
  });
  document.getElementById('levelSelect').classList.remove('hidden');
}
document.getElementById('homeBtn').onclick = () => { speechSynthesis.cancel(); showLevels(); };
document.getElementById('retryBtn').onclick = () => { speechSynthesis.cancel(); loadLevel(levelIdx); };
document.getElementById('startBtn').onclick = () => {
  initAudio();
  goFullscreen();
  document.getElementById('startOverlay').classList.add('hidden');
  showLevels();
  if (!progress.done.some(Boolean)) {
    speak('Bem-vindo ao Mundo Pegajoso! Os Goominhos precisam da tua ajuda. Escolhe o primeiro nível!');
  }
};
// fullscreen + landscape lock (best-effort; iOS Safari only honors the PWA/manifest path)
function goFullscreen() {
  try {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req && !document.fullscreenElement) {
      const p = req.call(el, { navigationUI: 'hide' });
      if (p && p.then) p.then(lockLandscape).catch(() => {});
      else lockLandscape();
    }
  } catch (e) {}
}
function lockLandscape() {
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
}
// rotate hint: show during gameplay on portrait phones
const rotateHint = document.getElementById('rotateHint');
function updateRotateHint() {
  const inGame = document.getElementById('gameWrap').classList.contains('active');
  rotateHint.classList.toggle('show', inGame);
}
window.addEventListener('orientationchange', () => setTimeout(() => { fitCanvas(); updateRotateHint(); }, 300));
window.addEventListener('resize', updateRotateHint);
document.addEventListener('fullscreenchange', () => setTimeout(fitCanvas, 300));

// ==================== BOOT ====================
fitCanvas();
fetch('assets/levels.json').then(r => r.json()).then(data => {
  LEVELS = data;
  LEVELS.forEach(lv => { const im = new Image(); im.src = 'assets/bg' + lv.id + '.jpg'; bgImgs[lv.id] = im; });
  requestAnimationFrame(t => { lastT = t; tick(t); });
});
</script>
